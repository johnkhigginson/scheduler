name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other onto the same box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deploying is not reversible in one click, so the suite runs against a throwaway Mongo first
  # and the deploy job refuses to start unless it passes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish DraftPoll.csproj -c Release -o publish --nologo

      - name: End to end tests
        env:
          ConnectionStrings__Mongo: mongodb://127.0.0.1:27017
          Mongo__Database: e2e
          ASPNETCORE_URLS: http://127.0.0.1:5099
        run: |
          nohup dotnet publish/DraftPoll.dll > app.log 2>&1 &
          APP_PID=$!

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5099/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:5099/healthz >/dev/null 2>&1; then
            echo "App never became healthy. Log follows:"
            cat app.log
            exit 1
          fi

          status=0
          BASE_URL=http://127.0.0.1:5099 bash tests/e2e.sh || status=$?

          kill "$APP_PID" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "App log follows:"
            cat app.log
          fi
          exit "$status"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish DraftPoll.csproj -c Release -o publish --nologo

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          rsync -az --delete --no-perms --no-owner --no-group \
            -e "ssh -i ~/.ssh/id_ed25519" \
            publish/ "draftpoll@${DEPLOY_HOST}:/var/www/draftpoll/"

      - name: Restart service
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "draftpoll@${DEPLOY_HOST}" \
            'sudo /bin/systemctl restart draftpoll'

      - name: Health check
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
        run: |
          for attempt in $(seq 1 10); do
            sleep 3
            code=$(curl -s -o /dev/null -w '%{http_code}' "${DEPLOY_URL}/healthz" || true)
            if [ "$code" = "200" ]; then
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Attempt ${attempt}: got ${code}"
          done
          echo "App did not come back healthy. Check: journalctl -u draftpoll -n 100"
          exit 1
