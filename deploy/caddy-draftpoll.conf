# The scheduler.sdw.dev block from /etc/caddy/Caddyfile, kept here so the repo shows how the app is
# actually fronted. Caddy handles certificates on its own, so there is no certbot step.

scheduler.sdw.dev {
    encode gzip zstd

    header {
        X-Content-Type-Options "nosniff"
        X-Frame-Options "SAMEORIGIN"
        Referrer-Policy "same-origin"
        # Everything the app needs is same origin. Inline style attributes are used in the markup,
        # so style-src has to allow them; scripts are all external files and do not.
        Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    }

    # Poll pages are private by link, not by password, so keep those out of search results.
    # The homepage is the product and should be findable.
    @private path /p/*
    header @private X-Robots-Tag "noindex, nofollow"

    # Static assets carry no fingerprint, so keep the cache short. Note the tradeoff: for up to ten
    # minutes after a deploy a returning visitor can hold old CSS or JS against new markup.
    @assets path *.css *.js
    header @assets Cache-Control "public, max-age=600"

    request_body {
        max_size 256KB
    }

    reverse_proxy 127.0.0.1:5080
}
